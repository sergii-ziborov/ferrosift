[package]
name = "ferrosift-host"
description = "Hosted job and artifact layer for FerroSift CLI and MCP adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["cyberchef", "mcp", "artifacts", "pipeline", "ferrosift"]
categories = ["encoding", "command-line-utilities"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
ferrosift-compat = { workspace = true }
ferrosift-core = { workspace = true }
ferrosift-model = { workspace = true }
ferrosift-operations = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
