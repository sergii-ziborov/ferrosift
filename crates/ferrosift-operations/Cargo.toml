[package]
name = "ferrosift-operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable pure-Rust operations for FerroSift"

[dependencies]
aes = { version = "0.8.4", default-features = false }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
cbc = { version = "0.1.2", default-features = false, features = ["alloc"] }
cfb-mode = { version = "0.8.2", default-features = false }
cipher = { version = "0.4.4", default-features = false, features = ["alloc", "block-padding"] }
ctr = { version = "0.9.2", default-features = false }
ecb = { version = "0.1.2", default-features = false, features = ["alloc"] }
ferrosift-core = { path = "../ferrosift-core" }
ferrosift-model = { path = "../ferrosift-model" }
hmac = { version = "0.12.1", default-features = false }
md-5 = { version = "0.10.6", default-features = false }
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
ofb = { version = "0.6.1", default-features = false }
oxiarc-bzip2 = "0.4.1"
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
regex-automata = { version = "0.4.13", default-features = false, features = ["alloc", "meta", "syntax", "unicode"] }
scrypt = { version = "0.11.0", default-features = false }
sha1 = { version = "0.10.6", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
sha3 = { version = "0.10.8", default-features = false }

[dev-dependencies]
ferrosift-compat = { path = "../ferrosift-compat" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true
