[package]
name = "ferrosift-operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable pure-Rust operations for FerroSift"

[features]
# Everything portable. The default, and what the conformance corpus pins.
default = ["portable-full"]
portable-full = ["analysis", "arithmetic", "compression", "crypto", "hash", "text"]

# Arbitrary precision, as a dependency rather than as a subject.
#
# num-bigint with default features off: three pure-Rust crates, and both
# bare-metal targets build with it. The reference reaches for JavaScript's
# BigInt in these places, and a fixed-width port would be a different
# operation — cryptographic moduli routinely exceed sixty-four bits, which is
# most of the reason Modular Inverse exists at all.
#
# Named separately from `arithmetic` because wanting Base62 is not wanting
# Extended GCD. Base62 and the ASN.1 object identifiers are encodings that
# happen to need big integers; the arithmetic operations are the subject
# itself. They share a dependency, not a purpose.
bignum = ["dep:num-bigint", "dep:num-traits"]

# Arbitrary-precision integer arithmetic: Extended GCD and Modular Inverse.
arithmetic = ["bignum"]

# Digests and HMAC.
hash = [
    "dep:blake2",
    "dep:digest",
    "dep:hmac",
    "dep:md2",
    "dep:md4",
    "dep:md5",
    "dep:ripemd",
    "dep:sha1",
    "dep:sha2",
    "dep:sha3",
    "dep:sm3",
    "dep:streebog",
    "dep:whirlpool",
]
# Ciphers and key derivation.
#
# PBKDF2 and scrypt need the SHA and HMAC *crates*, which is not the same as
# needing the SHA, MD2, MD4, RIPEMD, SM3, and Whirlpool *operations*. Asking
# for AES used to register all of them; it now pulls only the primitives the
# key derivations instantiate.
crypto = [
    "dep:digest",
    "dep:hmac",
    "dep:md5",
    "dep:sha1",
    "dep:sha2",
    "dep:aes",
    "dep:aes-gcm",
    "dep:cbc",
    "dep:cfb-mode",
    "dep:cipher",
    "dep:ctr",
    "dep:ecb",
    "dep:ofb",
    "dep:pbkdf2",
    "dep:scrypt",
]
# Deflate, gzip, zlib, and bzip2.
compression = ["dep:miniz_oxide", "dep:oxiarc-bzip2"]
# Indicator extraction and defanging.
text = ["dep:regex-automata"]
# Recipe suggestion and XOR brute force.
#
# Probes widen with whatever else is compiled rather than pulling packs in.
# `analysis` alone offers Base64, Hex, Base32, URL, HTML, and ROT13; adding
# `compression` or `text` adds their probes too. Forcing both used to drag in a
# regex engine and bzip2, and bzip2's transitive std edge is what kept
# `analysis` off bare metal.
analysis = []

# Operations outside these packs — identity, flow control, byte slicing, XOR,
# and nearly every encoding — carry no external dependency and are always
# compiled. Three are not among them, each for a named reason: Find / Replace
# needs the regex engine for its Regex mode, so it belongs to `text`; Base62
# and the object identifiers need arbitrary precision, so they belong to
# `bignum`.

[dependencies]
aes = { version = "0.8.4", default-features = false, optional = true }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"], optional = true }
cbc = { version = "0.1.2", default-features = false, features = ["alloc"], optional = true }
cfb-mode = { version = "0.8.2", default-features = false, optional = true }
cipher = { version = "0.4.4", default-features = false, features = ["alloc", "block-padding"], optional = true }
ctr = { version = "0.9.2", default-features = false, optional = true }
ecb = { version = "0.1.2", default-features = false, features = ["alloc"], optional = true }
ferrosift-core = { path = "../ferrosift-core" }
ferrosift-model = { path = "../ferrosift-model" }
hmac = { version = "0.12.1", default-features = false, optional = true }
blake2 = { version = "0.10.6", default-features = false, optional = true }
digest = { version = "0.10.7", default-features = false, optional = true }
md2 = { version = "0.10.2", default-features = false, optional = true }
md4 = { version = "0.10.2", default-features = false, optional = true }
# Declared under the name the code imports, so the manifest and the `use`
# statements agree; the published crate is `md-5`.
md5 = { package = "md-5", version = "0.10.6", default-features = false, optional = true }
num-bigint = { version = "0.5.1", default-features = false, optional = true }
num-traits = { version = "0.2.19", default-features = false, optional = true }
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"], optional = true }
ofb = { version = "0.6.1", default-features = false, optional = true }
oxiarc-bzip2 = { version = "0.4.1", optional = true }
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"], optional = true }
regex-automata = { version = "0.4.13", default-features = false, features = ["alloc", "meta", "syntax", "unicode"], optional = true }
scrypt = { version = "0.11.0", default-features = false, optional = true }
sha1 = { version = "0.10.6", default-features = false, optional = true }
sha2 = { version = "0.10.9", default-features = false, optional = true }
ripemd = { version = "0.1.3", default-features = false, optional = true }
sha3 = { version = "0.10.8", default-features = false, optional = true }
sm3 = { version = "0.4.2", default-features = false, optional = true }
streebog = { version = "0.10.2", default-features = false, optional = true }
whirlpool = { version = "0.10.4", default-features = false, optional = true }

[dev-dependencies]
ferrosift-compat = { path = "../ferrosift-compat" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true
