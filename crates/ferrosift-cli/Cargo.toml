[package]
name = "ferrosift-cli"
description = "Native command-line interface for FerroSift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ferrosift"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
ferrosift-compat = { path = "../ferrosift-compat" }
ferrosift-core = { path = "../ferrosift-core" }
ferrosift-model = { path = "../ferrosift-model" }
ferrosift-operations = { path = "../ferrosift-operations" }
serde_json = "1.0.151"

[lints]
workspace = true
