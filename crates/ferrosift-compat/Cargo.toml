[package]
name = "ferrosift-compat"
description = "Explicit external recipe compatibility for FerroSift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["cyberchef", "recipe", "no-std", "interop", "ferrosift"]
categories = ["encoding", "no-std"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
ferrosift-core = { workspace = true }
ferrosift-model = { workspace = true }
serde = { version = "1.0.229", default-features = false, features = ["alloc"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc", "arbitrary_precision"] }

[lints]
workspace = true
