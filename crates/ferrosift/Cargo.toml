[package]
name = "ferrosift"
description = "One API for FerroSift data transformations and binary patterns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["cyberchef", "no-std", "encoding", "forensics", "hexpat"]
categories = ["encoding", "no-std", "cryptography", "parser-implementations"]

[package.metadata.docs.rs]
all-features = true

[features]
# The whole catalog plus the hex-pattern engine.
default = ["full", "pattern"]

# Operation packs, forwarded to ferrosift-operations. Identity, flow control,
# every encoding, byte slicing, and XOR need no pack and are always present.
#
# `portable-full` is everything that builds on bare metal. It used to include
# bzip2, which does not: `oxiarc-bzip2` reaches `thiserror`, and `thiserror`
# needs `std`. A name that says portable has to be portable, so `full` is now
# the one that takes everything.
portable-full = [
    "analysis",
    "arithmetic",
    "compression-deflate",
    "crypto",
    "hash",
    "text",
]
full = ["portable-full", "compression-bzip2"]
analysis = ["ferrosift-operations/analysis"]
arithmetic = ["ferrosift-operations/arithmetic"]
# Base62 and the ASN.1 object identifiers: encodings that need arbitrary
# precision. Separate from `arithmetic` because wanting Base62 is not wanting
# Extended GCD; they share a dependency, not a purpose.
bignum = ["ferrosift-operations/bignum"]
compression-deflate = ["ferrosift-operations/compression-deflate"]
compression-bzip2 = ["ferrosift-operations/compression-bzip2"]
compression = ["compression-deflate", "compression-bzip2"]
crypto = ["ferrosift-operations/crypto"]
hash = ["ferrosift-operations/hash"]
text = ["ferrosift-operations/text"]

# The binary pattern engine, independent of every operation pack. Selecting
# only this gives a parser and evaluator with no third-party dependency.
pattern = ["dep:ferrosift-pattern"]

[dependencies]
ferrosift-core = { workspace = true }
ferrosift-model = { workspace = true }
ferrosift-operations = { workspace = true }
ferrosift-pattern = { workspace = true, optional = true }

[lints]
workspace = true
