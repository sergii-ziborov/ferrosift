[package]
name = "ferrosift-mcp"
description = "Local stdio MCP adapter for FerroSift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["cyberchef", "mcp", "agent", "encoding", "ferrosift"]
categories = ["command-line-utilities", "encoding"]

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "ferrosift-mcp"
path = "src/main.rs"
doc = false

[dependencies]
ferrosift-host = { workspace = true }
rmcp = { version = "3.2.0", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[lints]
workspace = true
