[workspace]
members = [
    "crates/ferrosift-compat",
    "crates/ferrosift-core",
    "crates/ferrosift-model",
    "crates/ferrosift-operations",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/sergii-ziborov/ferrosift"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
