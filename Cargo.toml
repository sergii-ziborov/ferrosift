[workspace]
members = [
    "crates/ferrosift",
    "crates/ferrosift-cli",
    "crates/ferrosift-compat",
    "crates/ferrosift-core",
    "crates/ferrosift-model",
    "crates/ferrosift-operations",
    "crates/ferrosift-pattern",
]
# The development task runner is not part of the shipped workspace: it uses
# std and processes, so it must not reach the wasm check or the library graph.
exclude = ["bench", "xtask"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/sergii-ziborov/ferrosift"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
