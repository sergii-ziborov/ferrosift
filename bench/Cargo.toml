[package]
name = "ferrosift-bench"
description = "Benchmarks for FerroSift against specialist crates and the reference"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/sergii-ziborov/ferrosift"
publish = false

# This crate is outside the workspace on purpose. Its dependencies are
# comparison targets, and none of them may reach the shipped library graph,
# the WASM check, or the bare-metal builds. Keeping it excluded is what makes
# "FerroSift pulls no dependency you did not ask for" checkable rather than
# stated.

[lib]
path = "src/lib.rs"

[dependencies]
ferrosift = { path = "../crates/ferrosift" }
ferrosift-core = { path = "../crates/ferrosift-core" }
ferrosift-model = { path = "../crates/ferrosift-model" }
ferrosift-operations = { path = "../crates/ferrosift-operations" }

# The other Rust CyberChef port, and the only comparison here that is a peer
# rather than a specialist: it answers "is FerroSift fast for a library of this
# shape", where `base64` answers "is FerroSift fast for a codec".
#
# Optional and off by default, for a reason worth recording rather than
# working around. rxchef depends unconditionally on `fernet`, which depends on
# `openssl`, which needs a system OpenSSL install and a Perl toolchain to
# build. Running a benchmark should not require that, so the arm is opt-in:
#
#     cargo bench --features peer --bench peer
#
# A regular dependency rather than a dev-dependency because cargo does not
# allow optional dev-dependencies. Pinned to a commit because rxchef is not
# published to crates.io.
rxchef = { git = "https://github.com/MichaelWeissDEV/rx-chef", rev = "99e26de96e28faed5b850a32825afcc7cfd9cd22", optional = true }

# Declared so that OpenSSL is *obtained* without a system install, not to be
# used: nothing in this crate calls it. rx-chef asks for a vendored OpenSSL on
# Windows and a system one everywhere else, and a benchmark should not require
# `libssl-dev` to be present before it will build. Cargo unifies features, so
# asking for `vendored` here is what makes the Unix build self-contained too.
#
# It changes where OpenSSL comes from and nothing about what is measured:
# no arm in `benches/peer.rs` touches it.
[target.'cfg(unix)'.dependencies]
openssl = { version = "0.10", features = ["vendored"], optional = true }

[features]
# The peer comparison against rx-chef. Off by default because building it
# needs a system OpenSSL toolchain; see the dependency note below.
peer = ["dep:rxchef", "dep:openssl"]

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false, features = ["cargo_bench_support"] }

# Comparison targets, pinned exactly rather than by range: a benchmark that
# silently changes what it measured is not a benchmark.
#
# Where more than one crate implements the same thing, the faster one is
# included too. Beating the slower of two available crates and reporting that
# as a win is the thing this file exists to make impossible — so `hex` and
# `faster-hex` are both here, and whichever beats FerroSift is printed.
base64 = "=0.22.1"
crc32fast = "=1.5.1"
faster-hex = "=0.10.0"
hex = "=0.4.3"
md-5 = "=0.10.6"
sha2 = "=0.10.9"
strsim = "=0.11.1"

# Fixed rather than inherited, so the numbers do not move when a cargo
# default does. Optimisation settings are part of a measurement.
[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "unwind"

[[bench]]
name = "encoding"
harness = false

[[bench]]
name = "digest"
harness = false

[[bench]]
name = "dispatch"
harness = false

# An excluded crate cannot inherit workspace lints, so the same rules the
# shipped crates hold to are repeated rather than quietly dropped.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Opt-in: needs the peer feature, which pulls rxchef and therefore OpenSSL.
[[bench]]
name = "peer"
harness = false
required-features = ["peer"]
