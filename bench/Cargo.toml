[package]
name = "ferrosift-bench"
description = "Benchmarks for FerroSift against specialist crates and the reference"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/sergii-ziborov/ferrosift"
publish = false

# This crate is outside the workspace on purpose. Its dependencies are
# comparison targets, and none of them may reach the shipped library graph,
# the WASM check, or the bare-metal builds. Keeping it excluded is what makes
# "FerroSift pulls no dependency you did not ask for" checkable rather than
# stated.

[lib]
path = "src/lib.rs"

[dependencies]
ferrosift = { path = "../crates/ferrosift" }
ferrosift-core = { path = "../crates/ferrosift-core" }
ferrosift-model = { path = "../crates/ferrosift-model" }
ferrosift-operations = { path = "../crates/ferrosift-operations" }

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false, features = ["cargo_bench_support"] }

# Comparison targets, pinned exactly rather than by range: a benchmark that
# silently changes what it measured is not a benchmark.
#
# Where more than one crate implements the same thing, the faster one is
# included too. Beating the slower of two available crates and reporting that
# as a win is the thing this file exists to make impossible — so `hex` and
# `faster-hex` are both here, and whichever beats FerroSift is printed.
base64 = "=0.22.1"
crc32fast = "=1.4.2"
faster-hex = "=0.10.0"
hex = "=0.4.3"
md-5 = "=0.10.6"
sha2 = "=0.10.9"
strsim = "=0.11.1"

# Fixed rather than inherited, so the numbers do not move when a cargo
# default does. Optimisation settings are part of a measurement.
[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "unwind"

[[bench]]
name = "encoding"
harness = false

[[bench]]
name = "digest"
harness = false

[[bench]]
name = "dispatch"
harness = false

# An excluded crate cannot inherit workspace lints, so the same rules the
# shipped crates hold to are repeated rather than quietly dropped.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
