name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show pinned toolchain
        run: rustc --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features
        env:
          RUSTFLAGS: -D warnings
      - name: Build documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    name: Portable WASM workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the portable workspace
        run: cargo check --workspace --target wasm32-unknown-unknown
        env:
          RUSTFLAGS: -D warnings

  # Feature packs are a public contract, so every pack is built on its own.
  # An --all-features build hides a pack that forgets to declare what it needs.
  #
  # Each entry names the features for *each* crate separately, because the two
  # do not have the same feature space: `pattern` belongs to the facade and the
  # catalog has never heard of it. One shared string for both meant the
  # difference had to be patched back out with `if:` conditions on the step —
  # `portable-full,pattern` was special-cased and `full,pattern` was not, so
  # that entry passed the catalog a feature it does not have and failed. An
  # explicit mapping removes the whole class rather than the one instance.
  #
  # `operations: skip` is for the entries with nothing to check on that side.
  features:
    name: Feature pack (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: none, facade: "", operations: ""}
          - {name: pattern, facade: pattern, operations: skip}
          - {name: hash, facade: hash, operations: hash}
          - {name: crypto, facade: crypto, operations: crypto}
          - {name: compression-deflate, facade: compression-deflate, operations: compression-deflate}
          - {name: compression-bzip2, facade: compression-bzip2, operations: compression-bzip2}
          - {name: compression, facade: compression, operations: compression}
          - {name: text, facade: text, operations: text}
          - {name: analysis, facade: analysis, operations: analysis}
          - {name: arithmetic, facade: arithmetic, operations: arithmetic}
          - {name: bignum, facade: bignum, operations: bignum}
          - {name: portable-full, facade: portable-full, operations: portable-full}
          - {name: portable-full+pattern, facade: "portable-full,pattern", operations: portable-full}
          - {name: full, facade: full, operations: full}
          - {name: full+pattern, facade: "full,pattern", operations: full}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the facade
        run: >
          cargo check -p ferrosift --no-default-features
          ${{ matrix.facade && format('--features {0}', matrix.facade) || '' }}
        env:
          RUSTFLAGS: -D warnings
      - name: Check the operation catalog
        if: matrix.operations != 'skip'
        run: >
          cargo check -p ferrosift-operations --no-default-features
          ${{ matrix.operations && format('--features {0}', matrix.operations) || '' }}
        env:
          RUSTFLAGS: -D warnings

  # The packs must also hold on the portable target, not only natively.
  wasm-features:
    name: WASM feature pack (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", pattern, "portable-full,pattern"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add the portable target
        run: rustup target add wasm32-unknown-unknown
      - name: Check the facade
        run: >
          cargo check -p ferrosift --target wasm32-unknown-unknown --no-default-features
          ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
        env:
          RUSTFLAGS: -D warnings

  # `no_std` is a claim about targets that have no operating system, and
  # `wasm32-unknown-unknown` is not one of them: it still has `std`. Only a
  # real bare-metal target proves the claim, so build on two with different
  # word layouts and calling conventions.
  #
  # `compression` is absent on purpose: bzip2 comes from `oxiarc-bzip2`, whose
  # `oxiarc-core` needs `std`. That is the single remaining blocker and is
  # tracked in docs/portability.md. Listing the packs that do hold keeps the
  # gap measured rather than assumed.
  #
  # `arithmetic` and `bignum` are here too: `num-bigint` with default features
  # off is three pure-Rust crates and needs no `std`, which is what lets a
  # cryptographic modulus be computed on a microcontroller rather than only
  # near one. Both are listed because they can be selected independently, and a
  # release that quietly needed `std` would otherwise only fail one of them.
  #
  # `analysis` is present now. It used to require `compression` and `text`, so
  # it inherited that std edge; recipe suggestion now offers whichever probes
  # the build actually contains, and needs no pack of its own. It is listed
  # both alone and beside `text` so neither arrangement can regress unnoticed.
  embedded:
    name: Bare metal (${{ matrix.target }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, riscv32imac-unknown-none-elf]
        features:
          - ""
          - pattern
          - hash
          - crypto
          - text
          - analysis
          - arithmetic
          - bignum
          # The DEFLATE half of the compression pack, which is `no_std`. The
          # bzip2 half is not and is deliberately absent: it reaches
          # `thiserror`, which needs `std`.
          - compression-deflate
          - "analysis,text"
          # `portable-full` itself, which is what makes the name a claim rather
          # than a label. It used to include bzip2 and so could not be checked
          # here at all.
          - portable-full
          - "portable-full,pattern"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add the bare-metal target
        run: rustup target add ${{ matrix.target }}
      - name: Check the facade
        run: >
          cargo check -p ferrosift --target ${{ matrix.target }} --no-default-features
          ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
        env:
          RUSTFLAGS: -D warnings

  # `cargo xtask` is deliberately outside the workspace, so the gates above
  # never see it. Lint it on its own rather than leaving it unchecked.
  xtask:
    name: Task runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check formatting
        run: cargo fmt --manifest-path xtask/Cargo.toml -- --check
      - name: Run Clippy
        run: cargo clippy --manifest-path xtask/Cargo.toml --all-targets -- -D warnings

  # The benchmarks are outside the workspace, so nothing above compiles them.
  # An uncompiled benchmark rots silently and is then unavailable exactly when
  # a performance question comes up. This builds them and runs one iteration
  # of each; it does not measure, because a shared runner cannot.
  benchmarks:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint
        run: cargo clippy --manifest-path bench/Cargo.toml --all-targets -- -D warnings
      - name: Check formatting
        run: cargo fmt --manifest-path bench/Cargo.toml -- --check
      - name: Run each benchmark once
        run: cargo bench --manifest-path bench/Cargo.toml --benches -- --test

  # The fuzz targets are outside the workspace because they link libFuzzer and
  # need nightly with sanitizer instrumentation. That also means nothing above
  # compiles them, and a target that stops compiling is one nobody runs.
  #
  # This builds them and then fuzzes each for a few seconds. The short run is
  # not a search -- it is a check that every target starts, reaches the code it
  # names, and returns; a target wired to an operation that no longer exists
  # would otherwise pass by doing nothing. Real runs are long and belong
  # somewhere that can afford them.
  fuzz:
    name: Fuzz targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build every target
        run: cargo +nightly fuzz build
        working-directory: fuzz
      # A target with committed seeds gets them: the seeds are a claim about
      # where its interesting inputs are, and a claim nothing ever runs is one
      # nobody notices going stale. They also make the twenty seconds below
      # worth something — a mutator starting from nothing does not reach an
      # exponent extreme in that time, and starting from the seeds it begins
      # there.
      #
      # The corpus directory is created first. libFuzzer refuses to start when
      # the *first* directory it is given does not exist — "the required
      # directory corpus/bignumber does not exist" — and `corpus/` is generated
      # output, so it is absent on a fresh checkout and on a cache miss. The
      # build step passed and the run reported a failure that looked like a
      # finding; it was a target that never started.
      - name: Smoke each target
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            mkdir -p "corpus/$target"
            if [ -d "seeds/$target" ]; then
              cargo +nightly fuzz run "$target" "corpus/$target" "seeds/$target" -- -runs=2000 -max_total_time=20
            else
              cargo +nightly fuzz run "$target" "corpus/$target" -- -runs=2000 -max_total_time=20
            fi
            echo "::endgroup::"
          done
        working-directory: fuzz

  # A floor rather than a target. A number a build must *reach* invites tests
  # written to reach it, and a test written for a number checks the number. This
  # holds the opposite: whatever the suite already covers, it does not lose --
  # so adding an untested branch is a visible act rather than a rounding error.
  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Check coverage against the recorded floor
        run: cargo xtask coverage check

  # Packaging is a gate rather than a release step. Nothing here publishes; what
  # it checks is that the workspace *could* be, on every push rather than on the
  # day someone wants to.
  #
  # The failures it catches are all invisible to `cargo build`: a path
  # dependency without a version, a `readme` or `license-file` pointing outside
  # its own package, a crate whose sources no longer compile once lifted out of
  # the workspace, and a `.crate` past what the registry accepts.
  #
  # `--workspace` rather than one crate at a time: the members depend on each
  # other by exact version, and none of those versions exists on crates.io yet,
  # so packaging them separately would ask the index for a crate that is right
  # here. There is no `--allow-dirty`, which makes this a check that every
  # generated file in the tree was committed as well.
  package:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package every crate, and build each one unpacked
        run: cargo package --workspace
      - name: Report what each crate would ship
        run: ls -lh target/package/*.crate

  # The compatibility claim is only evidence if it cannot drift. Regenerate the
  # ledger from the code and fail when the committed copy disagrees. This needs
  # no reference checkout: every column comes from the catalog, the pack-only
  # builds, and the committed fixtures.
  ledger:
    name: Compatibility ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the ledger is current
        run: cargo xtask ledger check
        env:
          RUSTFLAGS: -D warnings
